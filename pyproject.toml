[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "A-share order-flow and US equity quantitative research"
# 3.11 起标准库自带 tomllib, qr/paths.py 用它读 qr.toml
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",     # panel / tick 的 parquet 读写
    "scipy",       # 统计检验与 Hawkes 拟合
    "matplotlib",  # 评估与回测出图
    "h5py",        # 读 LOB 重建产出的 H5
]

[project.optional-dependencies]
# 机器学习组合器(ashare/l3_factor/ml/, ashare/l3_factor/explore/market_hr.py)
ml = ["scikit-learn", "lightgbm"]
# 跨学科探索(ashare/l3_factor/explore/), 天文安慰剂实验专用
explore = ["astropy", "lightkurve"]
# 海外数据拉取(data_sources/massive/)
massive = ["boto3>=1.34", "botocore>=1.34"]
# 美股分钟研究：常规交易日历（节假日、夏令时、半日市）
us = ["exchange-calendars>=4.5,<5", "pandas>=2.2"]
# 一次装齐
all = ["quant-research[ml,explore,massive,us]"]

[tool.setuptools]
# qr 是共享工具；美股研究提供 python -m us_equity 入口。
# 原有 A 股研究脚本仍按原样直接调用。
packages = ["qr", "us_equity"]

[tool.setuptools.package-data]
# C++/CMake/shell 三份路径解析器与 qr/paths.py 同源, 非 .py 文件要显式带上,
# 否则非 editable 安装时它们不会进 site-packages。
qr = ["qr_paths.h", "qr_paths.sh", "qr_paths.cmake"]
us_equity = ["experiments/*.toml", "README.md"]
